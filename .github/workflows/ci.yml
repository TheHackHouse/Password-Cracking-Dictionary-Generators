name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      # Catches a committed SyntaxError, which is how lm-hash-joiner.py
      # shipped in an unrunnable state.
      - name: Byte-compile every script
        run: python -m compileall -q .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  build-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile case-permutation.c
        run: gcc -O3 -Wall -Wextra -Werror -o case-permutation case-permutation.c
      - name: Smoke test
        run: |
          ./case-permutation -w a1 --force | sort > c.txt
          python3 case-permutation.py -w a1 -q --force | sort > py.txt
          diff c.txt py.txt
